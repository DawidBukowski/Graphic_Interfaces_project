<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host - Dashboard - Wireframe</title>
    <link rel="stylesheet" href="wireframe-style.css">
</head>
<body>
    <div class="wireframe">
        <div class="wireframe-title">03. Prowadzący - Dashboard sesji (host.html - widok 2)</div>

        <div class="header">
            <div class="logo">Sesja: Historia Polski</div>
        </div>

        <div class="pin-display">
            123456
        </div>

        <div style="text-align: center;">
            <div class="status-badge">✓ Sesja aktywna</div>
            <button class="button" style="display: inline-block; padding: 10px 20px; margin-left: 15px;">
                📋 Kopiuj PIN
            </button>
        </div>

        <h3 style="margin: 30px 0 15px; font-size: 20px;">Uczestnicy:</h3>

        <table class="table">
            <thead>
                <tr>
                    <th>Imię</th>
                    <th>Postęp</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Jan Kowalski</td>
                    <td>3/10</td>
                    <td>⏳ W trakcie</td>
                </tr>
                <tr>
                    <td>Anna Nowak</td>
                    <td>10/10</td>
                    <td>✅ Ukończył</td>
                </tr>
                <tr>
                    <td>Piotr Wiśniewski</td>
                    <td>7/10</td>
                    <td>⏳ W trakcie</td>
                </tr>
            </tbody>
        </table>

        <button class="button primary" style="width: 100%; margin-top: 30px; padding: 20px; font-size: 18px;">
            Zamknij sesję
        </button>
    </div>
</body>
</html>
