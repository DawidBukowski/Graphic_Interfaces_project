<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participant - Question - Wireframe</title>
    <link rel="stylesheet" href="wireframe-style.css">
</head>
<body>
    <div class="wireframe">
        <div class="wireframe-title">06. Uczestnik - Pytanie (participant.html - widok 2)</div>

        <div class="question-card">
            <div class="question-number">Pytanie 3/10</div>

            <div class="question-text">
                W którym roku Polska odzyskała niepodległość?
            </div>
        </div>

        <div class="options-grid">
            <button class="option-button a">
                A. 1914
            </button>
            <button class="option-button b">
                B. 1918
            </button>
            <button class="option-button c">
                C. 1920
            </button>
            <button class="option-button d">
                D. 1945
            </button>
        </div>
    </div>
</body>
</html>
