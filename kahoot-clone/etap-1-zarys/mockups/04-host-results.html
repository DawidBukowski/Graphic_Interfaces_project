<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host - Results - Wireframe</title>
    <link rel="stylesheet" href="wireframe-style.css">
</head>
<body>
    <div class="wireframe">
        <div class="wireframe-title">04. Prowadzący - Wyniki sesji (host.html - widok 3)</div>

        <div class="header">
            <div class="logo">Wyniki sesji: Historia Polski</div>
        </div>

        <h2 style="text-align: center; font-size: 28px; margin: 30px 0;">
            🏆 Ranking
        </h2>

        <ul class="results-list">
            <li>
                <div>
                    <span class="rank">1.</span>
                    <span>Anna Nowak</span>
                </div>
                <span class="score">95/100 pkt</span>
            </li>
            <li>
                <div>
                    <span class="rank">2.</span>
                    <span>Piotr Wiśniewski</span>
                </div>
                <span class="score">80/100 pkt</span>
            </li>
            <li>
                <div>
                    <span class="rank">3.</span>
                    <span>Jan Kowalski</span>
                </div>
                <span class="score">70/100 pkt</span>
            </li>
        </ul>

        <button class="button primary" style="width: 100%; margin-top: 40px; padding: 20px; font-size: 18px;">
            Nowa sesja
        </button>
    </div>
</body>
</html>
