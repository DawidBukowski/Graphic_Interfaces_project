<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host - Import Quiz - Wireframe</title>
    <link rel="stylesheet" href="wireframe-style.css">
</head>
<body>
    <div class="wireframe">
        <div class="wireframe-title">02. Prowadzący - Import quizu (host.html - widok 1)</div>

        <div class="header">
            <div class="logo">QuizMaster - Prowadzący</div>
        </div>

        <div style="max-width: 600px; margin: 0 auto;">
            <div class="file-input">
                <div class="file-icon">📄</div>
                <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">
                    Wybierz plik JSON
                </div>
                <div style="color: #666; font-size: 14px;">
                    Kliknij lub przeciągnij plik quizu
                </div>
            </div>

            <div class="info-display">
                <div class="label">Wybrany plik:</div>
                <div class="value">historia.json</div>
            </div>

            <div class="info-display">
                <div class="label">Tytuł quizu:</div>
                <div class="value">Historia Polski</div>
            </div>

            <div class="info-display">
                <div class="label">Liczba pytań:</div>
                <div class="value">10</div>
            </div>

            <button class="button primary" style="width: 100%; margin-top: 30px; padding: 20px; font-size: 20px;">
                Utwórz sesję
            </button>
        </div>
    </div>
</body>
</html>
